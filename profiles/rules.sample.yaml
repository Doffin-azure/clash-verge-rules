# ============================================================
# Clash Verge - Rules 模板（样例）
# 用途：让下列域名直连，不经过中转/代理。
#
# 使用：Clash Verge -> 订阅右键 -> 编辑规则，粘贴到 prepend 下。
# 说明：prepend 的规则会插入到订阅规则最前面，优先命中。
#
# 直连目标 <DIRECT_GROUP> 请替换为：
#   - DIRECT                         （推荐，固定直连，不受策略组手动选择影响）
#   - 或你订阅里的直连策略组名，如 🎯 全球直连 / ❌不代理
# ============================================================

